# Default nflsim configuration.
# Every tunable number in the project lives in a file like this one, never in code.
# Copy this file, edit it, and pass it with `--config path/to/file.toml` to override.

[data]
# Where cached parquet files are written. Relative paths resolve from the working directory.
cache_dir = "data"
# First season fetched when no seasons are given (NGS data starts in 2016).
default_first_season = 2016
# Cached files for the current, in-progress season are refetched once older than this.
# Completed seasons never go stale.
current_season_max_age_hours = 12.0

[ratings]
# Team offense/defense ratings from play-by-play. Starting values; the Phase 1 backtest
# is what should settle them.
# Only plays with the offense's win probability inside [min_wp, max_wp] are rated
# (drops garbage time). Set 0.0 and 1.0 to rate every play.
min_wp = 0.05
max_wp = 0.95
# Shrinkage prior strength in plays: rating = (sum + k * prior) / (plays + k).
prior_plays_epa = 300.0
prior_plays_success = 200.0
prior_plays_pass_epa = 250.0
prior_plays_rush_epa = 400.0  # rushing EPA is noisier, so shrink harder
# Shrinkage prior strength for pace (offensive plays per game), in games.
prior_games_pace = 4.0
# Share of last season's deviation from league average kept in this season's prior.
carryover = 0.5

[model]
# Game-level points model (Phase 1). Each team's expected points are
#   league points per team-game + intercept + features . coefficients +/- home value,
# with coefficients fit by least squares on earlier seasons only.
# Features (each a deviation from league average as of the game):
#   off_epa, off_success, off_pace: the scoring team's offense
#   def_epa, def_success, def_pace: the opponent's defense (EPA/success allowed) and pace
features = ["off_epa", "def_epa", "off_success", "def_success", "off_pace", "def_pace"]
# Number of seasons before the predicted season used to fit the coefficients.
train_seasons = 5
# Expected points are floored here so the score distribution stays valid.
min_expected_points = 3.0

[sim]
# Points added to the winner when a simulated game ends tied (overtime, usually a field goal).
# The overtime winner is drawn with probability proportional to each team's expected points.
overtime_points = 3
