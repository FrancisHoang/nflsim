# Default nflsim configuration.
# Every tunable number in the project lives in a file like this one, never in code.
# Copy this file, edit it, and pass it with `--config path/to/file.toml` to override.

[data]
# Where cached parquet files are written. Relative paths resolve from the working directory.
cache_dir = "data"
# First season fetched when no seasons are given (NGS data starts in 2016).
default_first_season = 2016
# Cached files for the current, in-progress season are refetched once older than this.
# Completed seasons never go stale.
current_season_max_age_hours = 12.0

[ratings]
# Team offense/defense ratings from play-by-play. Starting values; the Phase 1 backtest
# is what should settle them.
# Only plays with the offense's win probability inside [min_wp, max_wp] are rated
# (drops garbage time). Set 0.0 and 1.0 to rate every play.
min_wp = 0.05
max_wp = 0.95
# Shrinkage prior strength in plays: rating = (sum + k * prior) / (plays + k).
prior_plays_epa = 300.0
prior_plays_success = 200.0
prior_plays_pass_epa = 250.0
prior_plays_rush_epa = 400.0  # rushing EPA is noisier, so shrink harder
# Shrinkage prior strength for pace (offensive plays per game), in games.
prior_games_pace = 4.0
# Share of last season's deviation from league average kept in this season's prior.
carryover = 0.5

[model]
# Game-level points model (Phase 1). Each team's expected points are
#   league points per team-game + intercept + features . coefficients +/- home value,
# with coefficients fit by least squares on earlier seasons only.
# Features (each a deviation from league average as of the game):
#   off_epa, off_success, off_pace: the scoring team's offense
#   def_epa, def_success, def_pace: the opponent's defense (EPA/success allowed) and pace
#   off_qb, off_rush, off_recv: the scoring team's offense built from player ratings
#     (projected usage x player EPA rating minus league role average; [player_ratings]).
#     Backtest 2021-2024 (2026-11-17): adding them leaves Brier unchanged (+0.0001) and
#     replacing off_epa/off_success with them is worse (+0.0022), so they are off by default.
features = ["off_epa", "def_epa", "off_success", "def_success", "off_pace", "def_pace"]
# Number of seasons before the predicted season used to fit the coefficients.
train_seasons = 5
# Expected points are floored here so the score distribution stays valid.
min_expected_points = 3.0
# How the expected margin is fit:
#   "points": home points model minus away points model (the Phase 1 baseline).
#   "direct": a separate least-squares fit of actual margin on home-minus-away features
#             and home field. The points model still sets the expected total. The points
#             model leaves out effects between the two sides, which narrows its margins.
margin_fit = "points"
# Build the player features from injury-aware lineups (Phase 3): each projected player's
# chance to play from the final injury report, with backups moving up when he is out
# ([injuries]). Needs injuries, depth_charts and snap_counts cached. Team-weeks with no
# injury report treat everyone as not on the report.
# Backtest 2021-2024 (2026-11-17), six team features + player features: vs. Phase 2 player
# features Brier -0.0004 (95% CI [-0.0014, +0.0004]); vs. the baseline Brier 0.2250 vs.
# 0.2254 (CI [-0.0024, +0.0017]). Not significant, so off by default.
injury_aware = false

[player_ratings]
# Player EPA ratings by role (Phase 2): dropback (QBs: passes, sacks, scrambles),
# carry (designed runs) and target. rating = (sum + k * prior) / (plays + k), where
# prior = position average in the role + d, and
#   d = carryover * last-season excess EPA / (last-season plays + k)
#     + unknown_deviation * k / (last-season plays + k).
# Chosen with `nflsim player-eval` on 2018-2022 and checked on 2023-2025 (2026-11-17).
prior_plays = { dropback = 200.0, carry = 300.0, target = 200.0 }
carryover = 0.7
# New players (no plays in the role last season) relative to the position average.
# Measured on 2018-2022: QBs -0.11 EPA/dropback, receivers -0.04/target, rushers 0.00.
unknown_deviation = { dropback = -0.10, carry = 0.0, target = -0.02 }
# Projected usage: exponentially weighted share of the team's role plays over recent
# rostered games, half-life in games. Short half-lives win: whoever played QB last game
# is the best guess without injury reports (Phase 3).
usage_half_life_games = { dropback = 0.25, carry = 1.0, target = 2.0 }
# Weekly-roster statuses that rule a player out (known days before kickoff).
unavailable_statuses = ["RES", "PUP", "SUS", "CUT", "RET", "NWT"]

[injuries]
# Chance a player plays given his final injury report (Phase 3). status: game status on
# the final report (none = on the practice report without one); practice: last practice
# participation (dnp, limited, full; none = not recorded).
# Measured with `nflsim injury-eval` on 2016-2022 (2026-11-17); cells with under ~50
# players pooled with their status. Players whose weekly roster status rules them out
# ([player_ratings] unavailable_statuses) are excluded: that is known separately.
# A regular had at least this share of offensive or defensive snaps in the team's
# previous game. Regulars listed questionable play far more often than others
# (questionable + limited: 81% vs. 58%).
regular_min_share = 0.25
# Doubtful players almost never play (1-2%), and Out players never do.
play_probability_regular.out = { dnp = 0.0, limited = 0.0, full = 0.0, none = 0.0 }
play_probability_regular.doubtful = { dnp = 0.02, limited = 0.02, full = 0.02, none = 0.02 }
play_probability_regular.questionable = { dnp = 0.50, limited = 0.81, full = 0.95, none = 0.70 }
play_probability_regular.none = { dnp = 0.98, limited = 0.99, full = 0.99, none = 0.99 }
play_probability_other.out = { dnp = 0.0, limited = 0.0, full = 0.0, none = 0.0 }
play_probability_other.doubtful = { dnp = 0.01, limited = 0.01, full = 0.01, none = 0.01 }
play_probability_other.questionable = { dnp = 0.28, limited = 0.58, full = 0.77, none = 0.70 }
play_probability_other.none = { dnp = 0.74, limited = 0.86, full = 0.89, none = 0.89 }
# Regulars not on the report at all (misses are healthy scratches and roster moves).
unlisted_regular = 0.97
# Rostered non-regulars not on the report (backups): assumed available if needed.
unlisted_other = 1.0
# When a player is out, everyone below him at his position moves up one place and takes
# that place's usage. Order: "usage" (projected usage, depth chart breaks ties such as
# backup QBs with no recent snaps) or "depth" (depth chart first). Squared error of
# expected usage vs. actual (`nflsim player-eval --injuries`), "usage" vs. "depth":
# 2018-2022 dropback 0.151 vs. 0.171, carry 0.113 vs. 0.135 (Phase 2: 0.179, 0.131);
# 2023-2025 holdout dropback 0.168 vs. 0.188 (Phase 2 0.206). Depth charts are often stale.
backup_order = "usage"
# Added to the questionable rate at these positions (clipped to [0, 1]). Questionable
# regular QBs played 65% in 2016-2022 (n=120) and 50% in 2023-2025 (n=56), vs. ~79% for
# other regulars. Other positions are within about 0.1 and not adjusted.
questionable_position_adjustment = { QB = -0.15 }

[matchups]
# Pass rush vs. pass protection ratings (Phase 4). From non-scramble dropbacks with known
# pressure (sacks count as pressure). Each rating is the team's deviation from the same
# season's league average (the pressure definition changes between seasons), using weeks
# before W only, shrunk toward carryover x last season's deviation with this strength in
# dropbacks: pressure counts all dropbacks, epa_pressured pressured ones, epa_clean clean ones.
# Chosen on 2018-2022 by out-of-sample skill at predicting each team-game's deviation
# (`nflsim matchup-eval`; 1 - MSE / MSE of the league average), checked on 2023-2025
# (2026-11-17). Skill tune / holdout, offense then defense:
#   pressure       0.086 / 0.044 and 0.013 / 0.030
#   epa_pressured  0.014 / 0.008 and 0.002 / -0.006
#   epa_clean      0.029 / 0.041 and 0.007 / 0.008
# Separate offense/defense strengths were mixed on the holdout, so they are shared.
prior_dropbacks = { pressure = 400.0, epa_pressured = 400.0, epa_clean = 800.0 }
carryover = 0.5

[sim]
# Points added to the winner when a simulated game ends tied (overtime, usually a field goal).
# The overtime winner is drawn with probability proportional to each team's expected points.
overtime_points = 3
# With injury-aware player features ([model] injury_aware): draw who plays separately in
# each run (true), or give every run the expected features (false). Sampling widens the
# score distribution when key players are uncertain. Backtest 2021-2024 (2026-11-17):
# same accuracy as expected features (Brier diff -0.00003, CI [-0.0003, +0.0002]).
sample_availability = true
# `nflsim simulate` lists players who may not play when they hold at least this share of
# their role (dropbacks, carries or targets) when healthy.
report_min_share = 0.05

[backtest]
# Equal-width bins of predicted home win probability in the calibration table.
calibration_bins = 10

[tuning]
# Candidate values for `nflsim tune`, a grid search over the [ratings] shrinkage settings.
# Every combination is backtested; the current [ratings] values are always included.
prior_plays_epa = [50.0, 100.0, 200.0, 300.0, 500.0, 800.0]
prior_plays_success = [50.0, 100.0, 200.0, 400.0]
carryover = [0.3, 0.5, 0.7, 0.9]
prior_games_pace = [2.0, 4.0, 8.0]
# [min_wp, max_wp] garbage-time windows.
wp_windows = [[0.05, 0.95], [0.0, 1.0], [0.1, 0.9]]
