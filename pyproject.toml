[project]
name = "nflsim"
version = "0.4.0"
description = "Monte Carlo NFL game simulator that accounts for injuries and player matchups."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Francis Hoang", email = "fhoa133@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "nflreadpy>=0.1.5",
    "numpy>=2.0",
    "polars>=1.0",
    "pyarrow>=18.0",
    "pydantic>=2.8",
    "typer>=0.12",
]

[project.scripts]
nflsim = "nflsim.cli:app"

[project.optional-dependencies]
dashboard = [
    "streamlit>=1.67.0",
]

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "ruff>=0.6",
]
docs = [
    "matplotlib>=3.8",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PTH"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["nflreadpy", "nflreadpy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
